var D=[],mx=1;for(var k=6;k>=0;k--){var a=d0-k*864e5,b=a+864e5,s=0;A.forEach(function(x){if(x.ts>=a&&x.ts<b)s+=x.tot});D.push([a,s]);if(s>mx)mx=s}
return h+D.map(function(x){var dt=new Date(x[0]);return'<div class="bar"><span>'+("0"+dt.getDate()).slice(-2)+"."+("0"+(dt.getMonth()+1)).slice(-2)+'</span><i style="width:'+Math.round(x[1]/mx*100)+'%"></i><b>'+x[1]+'</b></div>'}).join("")}
function simp(){var v=$("pm").value||"",re=/ms:([A-Za-z0-9_-]+)/g,m,os=[];while((m=re.exec(v))){try{var o=dec(m[1]);if(o&&o.no&&o.items)os.push(o)}catch(e){}}
if(!os.length){msg("Паёми дуруст нест (сатри ms: ёфт нашуд).");return}
Promise.all(os.map(function(o){return DB.collection("sales").doc(o.no).set(o)})).then(function(){$("pm").value="";msg("Сабт шуд: "+os.length+" фурӯш");lsal()}).catch(function(){msg("Хато ҳангоми сабт.")})}
var ST=["Нав","Дар роҳ","Таслим шуд","Бекор шуд"],SA=[];
function lsal(){DB.collection("sales").orderBy("ts","desc").limit(1000).get().then(function(sn){SA=[];SAL={};sn.docs.forEach(function(d){var x=d.data();if(!x.items)x={no:d.id,ts:x.ts,items:[{t:x.title,s:x.size,q:x.qty,p:x.price}],tot:x.price*x.qty,cust:x.cust,phone:x.phone,addr:x.addr,st:x.st};x.id=d.id;SAL[d.id]=x;SA.push(x)});
if($("sl")&&!$("ss"))$("sl").innerHTML='<div id="sst"></div><input id="ss" placeholder="Ҷустуҷӯ: рақам, ном, телефон" oninput="rsal()" style="margin:10px 0"><div id="slist"></div>';rsal()}).catch(function(){if($("sl"))$("sl").textContent="Хондан имконнопазир аст."})}
function rsal(){if(!$("slist"))return;var q=$("ss").value.toLowerCase(),L=SA.filter(function(x){return(x.no+" "+x.cust+" "+x.phone+" "+x.addr).toLowerCase().indexOf(q)>-1});
$("sst").innerHTML=stats(SA.filter(function(x){return x.st!="Бекор шуд"}));
$("slist").innerHTML=L.map(function(x){var i0=esc(x.id);return'<div class="oc"><div class="oh"><b>'+esc(x.no)+'</b><select onchange="ost(\''+i0+'\',this.value)">'+ST.map(function(s){return'<option'+((x.st||"Нав")==s?" selected":"")+'>'+s+'</option>'}).join("")+'</select></div><div class="on">'+esc(x.cust)+' · <span class="pg">'+esc(x.phone)+'</span></div><div class="oa">'+esc(x.addr)+'<br>'+x.items.map(function(i){return esc(i.t)+(i.s?" — "+esc(i.s):"")+" × "+i.q+" = "+i.p*i.q+" сомонӣ"}).join("<br>")+'</div><div class="ot">Ҳамагӣ: '+x.tot+' сомонӣ</div><div style="display:flex;gap:8px;margin-top:10px"><button class="gb" onclick="rview(\''+i0+'\')">Чек</button><button class="rb" onclick="sdel(\''+i0+'\')">Нест</button></div></div>'}).join("")||'<div class="empty">Холӣ</div>'}
function ost(id,v){var c=Object.assign({},SAL[id]);delete c.id;c.st=v;DB.collection("sales").doc(id).set(c).then(function(){SAL[id].st=v;SA.forEach(function(x){if(x.id==id)x.st=v});rsal()}).catch(function(){msg("Статус сабт нашуд.")})}
function sdel(id){ask("Фурӯш нест карда шавад?",function(){DB.collection("sales").doc(id).delete().then(lsal).catch(function(){msg("Нест нашуд.")})})}
function api(m,u,b){var h={},t=gs("ms_tok");if(t)h.Authorization="Bearer "+t;return fetch(u,{method:m,headers:h,body:b==null?undefined:((typeof b=="string"||b instanceof Blob)?b:JSON.stringify(b))}).then(function(r){if(r.status==401){AUTH=false;ss("ms_tok","");ss("ms_auth","")}return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw j;return j})})}
function save(){msg("Сабт мешавад...");var s2=Object.assign({},S);delete s2.ph;api("PUT","/api/data",{S:s2,P:P,C:C}).then(function(){msg("Сабт шуд ✓")}).catch(function(e){msg(e&&e.error=="unauthorized"?"Аз нав ворид шавед (⚙ → парол).":"Хато: сабт нашуд.")})}
AST={upload:function(f){return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(function(b){URL.revokeObjectURL(u);api("POST","/api/upload",b).then(res,rej)},"image/jpeg",.85)};im.onerror=rej;im.src=u})}};
DB={collection:function(){return{doc:function(id){return{set:function(o){return api("PUT","/api/order/"+encodeURIComponent(id),o)},delete:function(){return api("DELETE","/api/order/"+encodeURIComponent(id))}}},orderBy:function(){return this},limit:function(){return this},get:function(){return api("GET","/api/orders").then(function(l){return{size:l.length,docs:l.map(function(x){return{id:x.no,data:function(){return x}}})}})}}}};
function isAdm(){return location.hash=="#admin"||!!gs("ms_tok")}
all();
CAN=isAdm();AUTH=!!gs("ms_tok");AT=gs("ms_tab")||"ads";renderTop();
if(CAN&&AUTH&&gs("ms_open")=="1"){$("adm").className="open";adm()}
window.onhashchange=function(){CAN=isAdm();renderTop()};
fetch("/api/data").then(function(r){return r.ok?r.json():null}).then(function(d){if(d&&d.S&&d.P&&d.C){S=d.S;P=d.P;C=d.C;all()}}).catch(function(){});
</script>
